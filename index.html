<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CL Almacén">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>COLOR LED — Almacén</title>
<style>
:root{
  --bg:#FFFFFF; --panel:#F7F8FA; --panel2:#EEF0F3; --line:#E1E3E8;
  --text:#16181D; --sub:#6B7280; --accent:#65A30D; --accent-d:#4D7C0F;
  --ok:#16A34A; --warn:#D97706; --err:#DC2626; --info:#2563EB;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
html,body{height:100%;background:var(--bg);color:var(--text)}
#app{min-height:100dvh;display:flex;flex-direction:column}

.hdr{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px;padding-top:max(12px,env(safe-area-inset-top));flex-shrink:0}
.hdr-logo{width:34px;height:34px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;line-height:1;color:#111;flex-shrink:0}
.hdr-title{flex:1;min-width:0}
.hdr-name{font-size:14px;font-weight:800}
.hdr-sub{font-size:10px;color:var(--sub)}
.status-dot{width:9px;height:9px;border-radius:50%;background:#64748b;flex-shrink:0}
.queue-badge{background:var(--warn);color:#111;font-size:10px;font-weight:800;border-radius:10px;padding:2px 7px;display:none}
.queue-badge.show{display:inline-block}
.btn-icon{background:none;border:none;color:var(--sub);font-size:18px;cursor:pointer;padding:4px}

.screen{display:none;flex:1;overflow-y:auto;padding:14px;padding-bottom:24px}
.screen.active{display:flex;flex-direction:column;gap:12px}

.field label{display:block;font-size:11px;font-weight:600;color:var(--sub);margin-bottom:5px}
.field input{width:100%;padding:11px 12px;font-size:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);outline:none}
.field input:focus{border-color:var(--accent)}
.field{margin-bottom:12px}

.btn{border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#111}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-outline{background:none;border:1.5px solid var(--line);color:var(--text)}
.btn-danger{background:none;border:1.5px solid var(--err);color:var(--err)}
.btn-ok{background:var(--ok);color:#052e13}
.btn-sm{padding:8px 12px;font-size:12px;border-radius:8px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}
.pk-card{display:flex;align-items:center;gap:10px;cursor:pointer}
.pk-card:active{border-color:var(--accent)}
.pk-name{font-size:14px;font-weight:800}
.pk-partner{font-size:12px;color:var(--sub);margin-top:2px}
.pk-meta{font-size:10px;color:var(--sub);margin-top:4px}
.pk-arrow{color:var(--sub);font-size:18px}

.empty{text-align:center;padding:40px 20px;color:var(--sub);font-size:13px}
.loading{text-align:center;padding:40px 20px;color:var(--sub);font-size:13px}

.det-hdr{display:flex;align-items:center;gap:8px}
.det-name{font-size:16px;font-weight:900;flex:1}
.det-partner{font-size:12px;color:var(--sub)}
.progress-wrap{background:var(--panel2);border-radius:8px;height:8px;overflow:hidden;margin-top:8px}
.progress-bar{height:100%;background:var(--accent);transition:width .3s}
.progress-lbl{font-size:11px;color:var(--sub);margin-top:5px}

.line{display:flex;gap:10px;align-items:center}
.line-img{width:46px;height:46px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.line-info{flex:1;min-width:0}
.line-name{font-size:13px;font-weight:700}
.line-code{font-size:10px;color:var(--sub)}
.line-qty{font-size:12px;margin-top:3px}
.line-qty.ok{color:var(--ok)}
.line-qty.missing{color:var(--warn)}
.line-done-badge{font-size:16px}

.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

#scr-scanner{display:none;position:fixed;inset:0;z-index:9999;background:#000;flex-direction:column}
#scr-scanner.open{display:flex}
.scanner-bar{background:#111;padding:12px 16px;display:flex;align-items:center;gap:10px;padding-top:max(12px,env(safe-area-inset-top));flex-shrink:0}
.scanner-close{background:#333;border:none;color:#fff;border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer}
.scanner-hint{color:#94a3b8;font-size:11px;text-align:center;padding:10px;background:#111;flex-shrink:0}
#scanner-container{flex:1;width:100%;overflow:hidden}
#scanner-container video{width:100%!important;height:100%!important;object-fit:cover}
#scanner-container img{display:none}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#052e13;font-size:12px;font-weight:700;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--bg);border-radius:14px;padding:18px;width:100%;max-width:340px}
.modal-box h3{font-size:15px;font-weight:800;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--sub);margin-bottom:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.modal-actions .btn{flex:1}
</style>
</head>
<body>

<div id="scr-scanner">
  <div class="scanner-bar">
    <button class="scanner-close" onclick="closeScanner()">✕ Cerrar</button>
    <span style="color:#fff;font-size:13px;font-weight:600;flex:1;text-align:center">Escanear código</span>
  </div>
  <div id="scanner-container"></div>
  <div class="scanner-hint">Apunta la cámara al código de barras del producto</div>
</div>

<div id="app">
  <div class="hdr">
    <div class="hdr-logo">📦</div>
    <div class="hdr-title">
      <div class="hdr-name">COLOR LED Almacén</div>
      <div class="hdr-sub" id="hdr-sub">Sin configurar</div>
    </div>
    <span class="queue-badge" id="queue-badge">0</span>
    <div class="status-dot" id="conn-dot" title="Conexión"></div>
    <button class="btn-icon" onclick="goTo('scr-config')" title="Ajustes">⚙️</button>
  </div>

  <!-- CONFIGURACIÓN -->
  <div class="screen" id="scr-config">
    <div class="card">
      <div class="field" style="margin-bottom:0">
        <label>Tu nombre (almacenista)</label>
        <input id="cfg-op" placeholder="Ej. Juan Pérez" autocomplete="off">
      </div>
    </div>
    <button class="btn btn-primary" onclick="saveConfig()">Guardar y continuar</button>
    <div id="cfg-status" style="font-size:12px;color:var(--sub);text-align:center"></div>
  </div>

  <!-- LISTA DE ALBARANES -->
  <div class="screen" id="scr-list">
    <button class="btn btn-outline" onclick="loadPickings()">🔄 Actualizar</button>
    <div id="pk-list"></div>
  </div>

  <!-- DETALLE / ESCANEO -->
  <div class="screen" id="scr-detail">
    <button class="btn-icon" style="align-self:flex-start" onclick="goTo('scr-list')">← Volver a la lista</button>
    <div class="card">
      <div class="det-hdr">
        <div>
          <div class="det-name" id="det-name">—</div>
          <div class="det-partner" id="det-partner">—</div>
        </div>
      </div>
      <div class="progress-wrap"><div class="progress-bar" id="det-progress" style="width:0%"></div></div>
      <div class="progress-lbl" id="det-progress-lbl">0 / 0 unidades</div>
    </div>

    <button class="btn btn-primary" onclick="scanForCurrentPicking()">📷 Escanear producto</button>
    <button class="btn btn-outline" onclick="manualEntry()">⌨️ Código no legible, escribirlo</button>

    <div id="det-lines"></div>

    <button class="btn btn-outline" onclick="triggerPhoto('open')">📸 Fotos caja abierta</button>
    <button class="btn btn-outline" onclick="printLabels()">🏷️ Imprimir etiquetas</button>
    <button class="btn btn-outline" onclick="triggerPhoto('closed')">📸 Fotos caja cerrada con etiqueta</button>
    <button class="btn btn-outline" onclick="pedidoArmado()">📦 Pedido armado</button>
    <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none">

    <div class="btn-row">
      <button class="btn btn-ok" id="btn-validate" onclick="onValidate()" disabled style="font-size:12px;line-height:1.25">🚚 Pedido entregado a operador logístico</button>
      <button class="btn btn-danger" onclick="onShortage()">⚠️ No se puede completar</button>
    </div>
    <div id="det-hint" style="font-size:11px;text-align:center"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="manual-modal">
  <div class="modal-box">
    <h3>Registrar producto</h3>
    <div class="modal-sub">Escribe el código y la cantidad recibida.</div>
    <div class="field" style="margin-bottom:10px">
      <label>Código de producto (SKU)</label>
      <input id="manual-code" placeholder="Ej. CL011" autocomplete="off" autocapitalize="characters">
    </div>
    <div class="field" style="margin-bottom:4px">
      <label>Cantidad</label>
      <input id="manual-qty" type="number" inputmode="decimal" min="0" step="any" placeholder="1" value="1">
    </div>
    <div id="manual-error" style="font-size:11px;color:var(--err);min-height:14px;margin-bottom:6px"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeManualModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="submitManualEntry()">Registrar</button>
    </div>
  </div>
</div>

<script>
/* ── Service Worker ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e));
  });
}

/* ═══════════════════════════════════════════════════════════════
   CONFIGURACIÓN Y ESTADO
   ═══════════════════════════════════════════════════════════════
   El Worker y la API Key son fijos para toda la flota de teléfonos
   (los define Carolina una sola vez aquí); lo único que cambia por
   dispositivo/turno es el nombre del almacenista. */
const WORKER_URL = 'https://color-led-warehouse.colorlednaguanagua.workers.dev';
const API_KEY     = 'CAMILAcarolinaMICHEL1111';

let CONFIG = JSON.parse(localStorage.getItem('cl_config') || 'null');
let currentPicking = null;
let QUEUE_KEY = 'cl_offline_queue';

function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  const colors = { success:'var(--ok)', warn:'var(--warn)', error:'var(--err)', info:'var(--info)' };
  t.style.background = colors[type] || colors.success;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

/* Redondeo de presentación: evita mostrar 3.0000000001 en los avisos */
function fmtQty(n) {
  return Number(Number(n).toFixed(3));
}

function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function saveConfig() {
  const op = document.getElementById('cfg-op').value.trim();
  if (!op) {
    document.getElementById('cfg-status').textContent = 'Escribe tu nombre para continuar.';
    return;
  }
  CONFIG = { workerUrl: WORKER_URL, apiKey: API_KEY, operatorName: op };
  localStorage.setItem('cl_config', JSON.stringify(CONFIG));
  updateHdr();
  goTo('scr-list');
  loadPickings();
}

function updateHdr() {
  document.getElementById('hdr-sub').textContent = CONFIG ? CONFIG.operatorName : 'Sin configurar';
}

/* ═══════════════════════════════════════════════════════════════
   API — llamadas al Worker (nunca directo a Odoo)
   ═══════════════════════════════════════════════════════════════ */
function makeSignal(ms) {
  if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function') return AbortSignal.timeout(ms);
  const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal;
}

async function apiFetch(path, { method = 'GET', body } = {}) {
  const res = await fetch(CONFIG.workerUrl + path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      'X-API-KEY': CONFIG.apiKey,
      'X-Operator-Name': CONFIG.operatorName,
    },
    body: body ? JSON.stringify(body) : undefined,
    signal: makeSignal(15000),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

async function pingWorker() {
  const dot = document.getElementById('conn-dot');
  try {
    await fetch(CONFIG.workerUrl + '/health', { signal: makeSignal(6000) });
    dot.style.background = 'var(--ok)'; dot.title = 'Conectado';
  } catch (_e) {
    dot.style.background = 'var(--err)'; dot.title = 'Sin conexión';
  }
}

/* ═══════════════════════════════════════════════════════════════
   COLA OFFLINE — se guarda en localStorage, se reintenta al reconectar
   ═══════════════════════════════════════════════════════════════ */
function getQueue() { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); }
function setQueue(q) {
  localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
  const badge = document.getElementById('queue-badge');
  if (q.length) { badge.textContent = q.length; badge.classList.add('show'); }
  else { badge.classList.remove('show'); }
}

function enqueue(type, pickingId, payload) {
  const q = getQueue();
  q.push({ id: crypto.randomUUID(), type, pickingId, payload, ts: Date.now() });
  setQueue(q);
  toast('📴 Sin conexión — guardado para enviar después', 'warn');
}

async function flushQueue() {
  if (!CONFIG) return;
  let q = getQueue();
  if (!q.length) return;
  const remaining = [];
  for (const op of q) {
    try {
      const payload = { ...op.payload, idempotency_key: op.id };
      if (op.type === 'scan') await apiFetch(`/picking/${op.pickingId}/scan`, { method: 'POST', body: payload });
      else if (op.type === 'validate') await apiFetch(`/picking/${op.pickingId}/validate`, { method: 'POST', body: payload });
      else if (op.type === 'shortage') await apiFetch(`/picking/${op.pickingId}/shortage`, { method: 'POST', body: payload });
    } catch (e) {
      remaining.push(op); /* se detiene el orden si algo falla, para no desordenar */
    }
  }
  setQueue(remaining);
  if (remaining.length < q.length) toast('✅ ' + (q.length - remaining.length) + ' operación(es) sincronizada(s)');
  if (currentPicking) openPicking(currentPicking.id, true);
}

window.addEventListener('online', flushQueue);

/* ═══════════════════════════════════════════════════════════════
   LISTA DE ALBARANES
   ═══════════════════════════════════════════════════════════════ */
async function loadPickings() {
  const el = document.getElementById('pk-list');
  el.innerHTML = '<div class="loading">Cargando…</div>';
  try {
    const { pickings } = await apiFetch('/pickings');
    if (!pickings.length) { el.innerHTML = '<div class="empty">No hay albaranes listos para preparar.</div>'; return; }
    el.innerHTML = pickings.map(p => `
      <div class="card pk-card" style="margin-bottom:8px" onclick="openPicking(${p.id})">
        <div style="flex:1;min-width:0">
          <div class="pk-name">${p.name}</div>
          <div class="pk-partner">${p.partner_name || 'Sin cliente'}</div>
          <div class="pk-meta">${p.origin || ''} ${p.scheduled_date ? '· ' + p.scheduled_date : ''}</div>
        </div>
        <span class="pk-arrow">›</span>
      </div>`).join('');
  } catch (e) {
    el.innerHTML = `<div class="empty">❌ ${e.message}</div>`;
    toast('Error: ' + e.message, 'error');
  }
}

/* ═══════════════════════════════════════════════════════════════
   DETALLE DE ALBARÁN
   ═══════════════════════════════════════════════════════════════ */
async function openPicking(id, silent) {
  if (!silent) goTo('scr-detail');
  try {
    const { picking } = await apiFetch('/picking/' + id);
    currentPicking = picking;
    renderDetail();
  } catch (e) {
    toast('Error: ' + e.message, 'error');
  }
}

function renderDetail() {
  const p = currentPicking;
  document.getElementById('det-name').textContent = p.name;
  document.getElementById('det-partner').textContent = p.partner_name || 'Sin cliente';
  const pct = p.total_demanded ? Math.min(100, Math.round(100 * p.total_done / p.total_demanded)) : 0;
  document.getElementById('det-progress').style.width = pct + '%';
  document.getElementById('det-progress-lbl').textContent = `${p.total_done} / ${p.total_demanded} unidades`;

  document.getElementById('det-lines').innerHTML = p.move_lines.map(m => `
    <div class="card line" style="margin-bottom:8px">
      ${m.image_data_url
        ? `<img class="line-img" src="${m.image_data_url}">`
        : `<div class="line-img">📦</div>`}
      <div class="line-info">
        <div class="line-name">${m.product_name}</div>
        <div class="line-code">${m.default_code || ''} ${m.barcode ? '· ' + m.barcode : ''}</div>
        <div class="line-qty ${m.is_complete ? 'ok' : 'missing'}">
          ${m.qty_done} / ${m.qty_demanded} ${m.uom}
          ${m.qty_missing > 0 ? ' · faltan ' + m.qty_missing : ''}
        </div>
      </div>
      <span class="line-done-badge">${m.is_complete ? '✅' : ''}</span>
    </div>`).join('');

  const btnV = document.getElementById('btn-validate');
  const hint = document.getElementById('det-hint');
  btnV.disabled = !p.is_fully_scanned;
  if (p.is_fully_scanned) {
    hint.textContent = 'Todo escaneado — ya puedes validar el albarán.';
    hint.style.color = 'var(--ok)';
  } else {
    const missing = Math.max(0, p.total_demanded - p.total_done);
    hint.textContent = `Faltan ${missing} unidad(es) por escanear — el botón Validar se activa solo cuando el albarán queda completo.`;
    hint.style.color = 'var(--warn)';
  }
}

/* ═══════════════════════════════════════════════════════════════
   ESCÁNER — misma librería y patrón ya probado en Cotizador GONDER
   ═══════════════════════════════════════════════════════════════ */
let _qrScanner = null;
let _scanCb = null;

function openScanner(onDetect) {
  _scanCb = onDetect;
  document.getElementById('scr-scanner').classList.add('open');
  const script = document.getElementById('qr-lib');
  if (script) { _startQr(); return; }
  const s = document.createElement('script');
  s.id = 'qr-lib';
  s.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
  s.onload = _startQr;
  s.onerror = () => { closeScanner(); toast('❌ No se pudo cargar el lector', 'error'); };
  document.head.appendChild(s);
}

function _startQr() {
  try {
    _qrScanner = new Html5Qrcode('scanner-container');
    _qrScanner.start(
      { facingMode: 'environment' },
      { fps: 12, qrbox: { width: 260, height: 130 } },
      (code) => { closeScanner(); if (_scanCb) _scanCb(code); },
      () => {}
    ).catch(() => { closeScanner(); toast('❌ Sin acceso a cámara', 'error'); });
  } catch (e) { closeScanner(); toast('❌ ' + e.message, 'error'); }
}

function closeScanner() {
  document.getElementById('scr-scanner').classList.remove('open');
  if (_qrScanner) { _qrScanner.stop().catch(() => {}); _qrScanner = null; }
}

function scanForCurrentPicking() {
  if (!currentPicking) return;
  openScanner(async (barcode) => { await handleBarcodeScan(barcode); });
}

/* Escaneo con cámara: siempre busca por código de barras */
async function handleBarcodeScan(barcode) {
  const line = currentPicking.move_lines.find(m => m.barcode && m.barcode === barcode);
  if (!line) { toast('⚠️ Ese código de barras no pertenece a este albarán', 'warn'); return; }
  await promptQtyAndRegister(line);
}

/* Entrada manual: cuando la etiqueta está dañada o la cámara no puede leer el código de
   barras. Aquí se anota el CÓDIGO DE PRODUCTO (SKU / referencia interna), nunca el de barras.
   Se pide código y cantidad juntos en un mismo cuadro (no dos prompts seguidos). */
function manualEntry() {
  if (!currentPicking) return;
  const err = document.getElementById('manual-error');
  err.textContent = '';
  document.getElementById('manual-code').value = '';
  document.getElementById('manual-qty').value = '1';
  document.getElementById('manual-modal').classList.add('open');
  setTimeout(() => document.getElementById('manual-code').focus(), 50);
}

function closeManualModal() {
  document.getElementById('manual-modal').classList.remove('open');
}

function submitManualEntry() {
  const errEl = document.getElementById('manual-error');
  errEl.textContent = '';
  const code = document.getElementById('manual-code').value.trim();
  if (!code) { errEl.textContent = 'Escribe el código de producto.'; return; }

  const line = currentPicking.move_lines.find(m => m.default_code && m.default_code.toLowerCase() === code.toLowerCase());
  if (!line) { errEl.textContent = 'Ese código no pertenece a este albarán.'; return; }
  if (line.is_complete) { closeManualModal(); toast('ℹ️ ' + line.product_name + ' ya está completo', 'info'); return; }

  const qtyRaw = document.getElementById('manual-qty').value;
  let qty = parseFloat(String(qtyRaw).replace(',', '.'));
  if (!qty || isNaN(qty) || qty <= 0) { errEl.textContent = 'Escribe una cantidad válida.'; return; }

  const missing = line.qty_missing;
  if (qty > missing) {
    errEl.textContent = 'Solo faltan ' + fmtQty(missing) + ' unidad(es) de este producto.';
    return;
  }

  closeManualModal();
  registerScan(line.product_id, qty);
}

/* Pide cuántas unidades registrar para la línea encontrada (por escaneo o entrada manual).
   Permite tanto escanear/escribir varias veces (dejando 1 cada vez) como registrar de una
   sola vez la cantidad completa solicitada. */
async function promptQtyAndRegister(line) {
  if (line.is_complete) { toast('ℹ️ ' + line.product_name + ' ya está completo', 'info'); return; }
  const missing = line.qty_missing;
  const input = prompt(`${line.product_name}\nCantidad a registrar (máximo ${missing}):`, '1');
  if (input === null) return; /* canceló */
  let qty = parseFloat(String(input).replace(',', '.'));
  if (!qty || isNaN(qty) || qty <= 0) { toast('⚠️ Cantidad inválida', 'warn'); return; }
  if (qty > missing) {
    toast('⚠️ Solo faltan ' + fmtQty(missing) + ' de ' + line.product_name, 'warn');
    return;
  }
  await registerScan(line.product_id, qty);
}

async function registerScan(productId, qty) {
  const pickingId = currentPicking.id;
  /* Optimista: refleja el cambio en pantalla de inmediato */
  const line = currentPicking.move_lines.find(m => m.product_id === productId);
  if (line) {
    line.qty_done += qty;
    line.qty_missing = Math.max(0, line.qty_demanded - line.qty_done);
    line.is_complete = line.qty_done >= line.qty_demanded && line.qty_demanded > 0;
    currentPicking.total_done += qty;
    currentPicking.is_fully_scanned = currentPicking.move_lines.every(m => m.is_complete);
    renderDetail();
  }
  const payload = { product_id: productId, qty, operator_name: CONFIG.operatorName };
  try {
    await apiFetch(`/picking/${pickingId}/scan`, { method: 'POST', body: payload });
    toast('✓ Escaneado');
    openPicking(pickingId, true); /* refresca con datos reales del servidor */
  } catch (e) {
    enqueue('scan', pickingId, payload);
  }
}

/* ═══════════════════════════════════════════════════════════════
   ETIQUETAS DE DESPACHO
   ═══════════════════════════════════════════════════════════════
   Genera una etiqueta por bulto (1/N, 2/N…) con los datos del pedido
   tomados directo de Odoo — nadie transcribe el cliente a mano, así
   se evita el error de pegar la etiqueta equivocada en la caja. */
function printLabels() {
  const p = currentPicking;
  if (!p) return;

  const bultosRaw = prompt('¿Cuántos bultos son?', '1');
  if (bultosRaw === null) return; /* canceló */
  const bultos = parseInt(bultosRaw, 10);
  if (!bultos || isNaN(bultos) || bultos <= 0) { toast('⚠️ Cantidad de bultos inválida', 'warn'); return; }

  const fecha = p.scheduled_date ? p.scheduled_date.split(' ')[0].split('-').reverse().join('/') : '';
  const vatLine = p.partner_vat ? `<div class="sub">RIF ${p.partner_vat}</div>` : '';
  const dirLine = p.partner_address ? `<div class="dir">${p.partner_address}</div>` : '';

  /* QR que lleva a la página pública donde el cliente confirma que recibió
     la mercancía (sin precios) — dispara la factura borrador y el aviso
     por Telegram cuando escribe su RIF. El token va firmado por el Worker,
     nadie puede adivinarlo ni falsificarlo (ver hmacToken en worker.js). */
  const trackUrl = `${WORKER_URL}/track/${p.id}?t=${encodeURIComponent(p.track_token || '')}`;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&margin=0&data=${encodeURIComponent(trackUrl)}`;

  let labelsHtml = '';
  for (let i = 1; i <= bultos; i++) {
    labelsHtml += `
      <div class="label">
        <div class="row-top">
          <span class="brand">COLOR LED</span>
          <span class="bulto">${i}/${bultos}</span>
        </div>
        <div class="hr"></div>
        <div class="cliente">${p.partner_name || ''}</div>
        ${vatLine}
        ${dirLine}
        <div class="hr"></div>
        <div class="ped-lbl">Pedido</div>
        <div class="ped">${p.origin || '—'}</div>
        <div class="row-bottom">
          <span>${p.name}</span>
          <span>${fecha}</span>
        </div>
        <div class="hr"></div>
        <div class="qr-row">
          <img class="qr" src="${qrUrl}" alt="QR">
          <div class="qr-cap">Escanea para<br>confirmar<br>recepción</div>
        </div>
        <div class="hr"></div>
        <div class="foot">@GFgroupca</div>
      </div>`;
  }

  const win = window.open('', '_blank');
  if (!win) { toast('⚠️ Habilita las ventanas emergentes para imprimir', 'warn'); return; }
  win.document.write(`<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Etiquetas ${p.name}</title>
<style>
@page { size: auto; margin: 18mm 8mm 8mm 8mm; }
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;display:flex;justify-content:center}
.sheet{display:grid;grid-template-columns:repeat(2, 9cm);gap:6mm 8mm;justify-content:center}
.label{width:9cm;min-height:6cm;border:1px dashed #999;border-radius:3mm;padding:4mm 5mm;page-break-inside:avoid}
.row-top{display:flex;justify-content:space-between;align-items:baseline}
.brand{font-size:9px;font-weight:700;letter-spacing:.5px;color:#555}
.bulto{font-size:14px;font-weight:700}
.hr{border-top:1px solid #ccc;margin:3mm 0 2mm}
.cliente{font-size:13px;font-weight:700}
.sub{font-size:9px;color:#555;margin-top:1mm}
.dir{font-size:8.5px;color:#555;margin-top:1mm;line-height:1.3}
.ped-lbl{font-size:9px;color:#888;margin-top:1mm}
.ped{font-size:19px;font-weight:700;line-height:1.1}
.row-bottom{display:flex;justify-content:space-between;font-size:9px;color:#555;margin-top:2mm}
.qr-row{display:flex;align-items:center;gap:3mm}
.qr{width:20mm;height:20mm;flex-shrink:0}
.qr-cap{font-size:7.5px;color:#555;line-height:1.25}
.foot{font-size:10px;font-weight:700;color:#555;text-align:center}
</style>
</head>
<body>
<div class="sheet">${labelsHtml}</div>
<script>window.onload = () => { window.print(); };<\/script>
</body>
</html>`);
  win.document.close();
}

/* ═══════════════════════════════════════════════════════════════
   FOTOS DE BULTOS (caja abierta / caja cerrada con etiqueta)
   ═══════════════════════════════════════════════════════════════
   Abre la cámara del teléfono, comprime la foto en el navegador (para
   no gastar datos móviles) y la sube al Worker, que la adjunta directo
   al albarán en Odoo. El almacenista puede repetir el botón las veces
   que necesite (una foto por bulto, o las que hagan falta). */
let _photoKind = 'open';

function triggerPhoto(kind) {
  if (!currentPicking) return;
  _photoKind = kind;
  const input = document.getElementById('photo-input');
  input.value = '';
  input.click();
}

document.getElementById('photo-input').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file || !currentPicking) return;
  const pickingId = currentPicking.id;
  const kind = _photoKind;
  const label = kind === 'closed' ? 'caja cerrada' : 'caja abierta';
  toast('📤 Subiendo foto de ' + label + '…', 'info');
  try {
    const dataUrl = await resizeImageToDataUrl(file, 1280, 0.72);
    const base64 = dataUrl.split(',')[1];
    await apiFetch(`/picking/${pickingId}/photo`, {
      method: 'POST',
      body: { kind, filename: `${label}-${Date.now()}.jpg`, data_base64: base64, operator_name: CONFIG.operatorName },
    });
    toast('✅ Foto de ' + label + ' guardada en el pedido');
  } catch (err) {
    toast('⚠️ No se pudo subir la foto: ' + err.message, 'error');
  }
});

/* Redimensiona/comprime una foto de cámara (suelen pesar varios MB) a un
   JPEG liviano antes de subirla — importante porque el almacenista está
   casi siempre con datos móviles, no wifi. */
function resizeImageToDataUrl(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer la foto'));
    reader.onload = () => {
      img.onerror = () => reject(new Error('No se pudo procesar la foto'));
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ═══════════════════════════════════════════════════════════════
   PEDIDO ARMADO — solo avisa por Telegram que el pedido ya está listo
   ═══════════════════════════════════════════════════════════════ */
async function pedidoArmado() {
  const p = currentPicking;
  if (!p) return;
  const payload = { operator_name: CONFIG.operatorName };
  try {
    await apiFetch(`/picking/${p.id}/armed`, { method: 'POST', body: payload });
    toast('📦 Aviso enviado: pedido armado');
  } catch (e) {
    toast('⚠️ No se pudo avisar: ' + e.message, 'error');
  }
}

/* ═══════════════════════════════════════════════════════════════
   VALIDAR / REPORTAR FALTANTE
   ═══════════════════════════════════════════════════════════════ */
async function onValidate() {
  const p = currentPicking;
  if (!p) return;
  if (!p.is_fully_scanned) {
    /* Defensa adicional: el botón ya está disabled mientras falte escanear,
       pero por si acaso nunca se debe poder validar sin completar el escaneo. */
    toast('⚠️ Aún faltan unidades por escanear', 'warn');
    return;
  }
  const payload = { operator_name: CONFIG.operatorName, force_partial: true };
  try {
    await apiFetch(`/picking/${p.id}/validate`, { method: 'POST', body: payload });
    toast('🚚 Pedido entregado a operador logístico');
    goTo('scr-list');
    loadPickings();
  } catch (e) {
    enqueue('validate', p.id, payload);
    goTo('scr-list');
  }
}

async function onShortage() {
  const p = currentPicking;
  if (!p) return;
  if (!confirm('¿Confirmas que este albarán se cierra con faltante? Se notificará al equipo.')) return;
  const payload = { operator_name: CONFIG.operatorName };
  try {
    await apiFetch(`/picking/${p.id}/shortage`, { method: 'POST', body: payload });
    toast('⚠️ Reportado con faltante');
    goTo('scr-list');
    loadPickings();
  } catch (e) {
    enqueue('shortage', p.id, payload);
    goTo('scr-list');
  }
}

/* ═══════════════════════════════════════════════════════════════
   INICIO
   ═══════════════════════════════════════════════════════════════ */
(function init() {
  if (CONFIG && CONFIG.operatorName) {
    /* El Worker/API Key siempre se toman de las constantes fijas,
       aunque el dispositivo tenga guardada una config vieja. */
    CONFIG = { workerUrl: WORKER_URL, apiKey: API_KEY, operatorName: CONFIG.operatorName };
    localStorage.setItem('cl_config', JSON.stringify(CONFIG));
    document.getElementById('cfg-op').value = CONFIG.operatorName;
    updateHdr();
    goTo('scr-list');
    loadPickings();
    pingWorker();
    flushQueue();
  } else {
    goTo('scr-config');
  }
  setQueue(getQueue());
})();
</script>
</body>
</html>
